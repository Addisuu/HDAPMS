version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: hdapms-postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME:-hdapms_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hdapms_secure_password}
      POSTGRES_DB: ${DB_NAME:-hdapms_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-hdapms_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hdapms-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hdapms-backend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-hdapms_user}
      DB_PASSWORD: ${DB_PASSWORD:-hdapms_secure_password}
      DB_NAME: ${DB_NAME:-hdapms_db}
      JWT_SECRET: ${JWT_SECRET:-your_super_secret_jwt_key_change_in_production}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-your_super_secret_refresh_key_change_in_production}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - ./backend/node_modules:/app/node_modules
    networks:
      - hdapms-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000/api}
    container_name: hdapms-frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000/api}
      NODE_ENV: ${NODE_ENV:-development}
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    depends_on:
      - backend
    networks:
      - hdapms-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: hdapms-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - hdapms-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  hdapms-network:
    driver: bridge
